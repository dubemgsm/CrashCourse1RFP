                        allData = results.data.filter(row => row.Country);
                        
                        // Aggregate data by Admin2
                        const aggregated = {};
                        allData.forEach(row => {
                            const admin1 = row.Admin1;
                            const admin2 = row.Admin2;
                            const key = `${admin1}|${admin2}`;

                                    admin2: admin2,
                                    events: 0,
                                    fatalities: 0

                                            <strong>Events:</strong> ${data.events}<br/>
